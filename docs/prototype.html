<title>LiftCrew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — slim top bar with demo login switcher, left rail nav (top tabs on phones), job "tickets" in the main column */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#f6f8fa; --ink:#14202e; --muted:#5a6878; --line:#d5dce4;
  --blanket:#23488f; --blanket-soft:#e3eaf7; --on-blanket:#ffffff;
  --kraft:#9a6b2c; --kraft-tape:#d8b47e; --kraft-soft:#f5ead8;
  --ok:#1f7a4d; --ok-soft:#e1f2e9; --warn:#9a5800; --warn-soft:#fbeedb; --bad:#b3261e; --bad-soft:#fbe4e2;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151d; --surface:#18212c; --sunk:#131b24; --ink:#e6ebf1; --muted:#93a1b0; --line:#2a3644;
  --blanket:#86a8ec; --blanket-soft:#1f2c45; --on-blanket:#0f151d;
  --kraft:#dcb57c; --kraft-tape:#8a6a3c; --kraft-soft:#2e261b;
  --ok:#66c896; --ok-soft:#173326; --warn:#e8a64f; --warn-soft:#352612; --bad:#f2908a; --bad-soft:#3a1c1a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151d; --surface:#18212c; --sunk:#131b24; --ink:#e6ebf1; --muted:#93a1b0; --line:#2a3644;
  --blanket:#86a8ec; --blanket-soft:#1f2c45; --on-blanket:#0f151d;
  --kraft:#dcb57c; --kraft-tape:#8a6a3c; --kraft-soft:#2e261b;
  --ok:#66c896; --ok-soft:#173326; --warn:#e8a64f; --warn-soft:#352612; --bad:#f2908a; --bad-soft:#3a1c1a;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.demo-bar{background:var(--kraft-soft);color:var(--kraft);font-size:.8rem;padding:6px 16px;text-align:center;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.6rem;font-weight:700;letter-spacing:.02em}
.logo svg{flex:none}
.switch{display:flex;align-items:center;gap:8px;font-size:.85rem}
.switch label{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;font-weight:600}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical}
:focus-visible{outline:2px solid var(--blanket);outline-offset:2px}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100% - 100px)}
nav{border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;background:var(--sunk)}
nav .who{padding:4px 10px 14px;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:8px}
nav .who strong{display:block;color:var(--ink);font-size:.95rem}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:6px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
nav button:hover{background:var(--blanket-soft)}
nav button[aria-current="page"]{background:var(--blanket);color:var(--on-blanket)}
nav button:focus-visible{outline:2px solid var(--blanket)}
.count{font-family:var(--mono);font-size:.75rem;background:var(--kraft-tape);color:var(--ink);border-radius:10px;padding:0 7px}
main{padding:28px 32px 60px;max-width:1040px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{max-width:60ch}

.btn{cursor:pointer;border:1px solid var(--blanket);background:var(--blanket);color:var(--on-blanket);border-radius:6px;padding:8px 14px;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--blanket)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--blanket-soft);color:var(--blanket)}
.pill.plain{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip{font-size:.78rem;padding:2px 8px;border:1px solid var(--line);border-radius:4px;background:var(--sunk)}

/* Job ticket */
.list{display:grid;gap:14px}
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px}
.ticket::before{content:"";position:absolute;top:-6px;left:22px;width:54px;height:14px;background:var(--kraft-tape);opacity:.85;transform:rotate(-2deg);border-radius:1px}
.ticket-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:start}
.ticket-no{font-family:var(--mono);font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px 18px;padding:10px 0;border-block:1px dashed var(--line)}
.fact .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.fact .v{font-weight:600;font-variant-numeric:tabular-nums}
.crew{display:grid;gap:8px}
.crew-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;background:var(--sunk);border-radius:6px}
.who-line{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:32px;height:32px;border-radius:50%;background:var(--blanket-soft);color:var(--blanket);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.av.lg{width:52px;height:52px;font-size:1.1rem}
.section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin:22px 0 10px}

/* Movers grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{background:var(--sunk);border-radius:6px;padding:6px 4px}
.stat b{display:block;font-family:var(--mono);font-size:1rem}
.stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.days{display:flex;gap:4px;flex-wrap:wrap}
.day{font-family:var(--mono);font-size:.72rem;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.day.on{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:500}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}

/* Private reviews */
.private{border:1px solid var(--kraft-tape);background:var(--kraft-soft);border-radius:var(--r);padding:10px 12px;font-size:.85rem;display:flex;gap:10px;align-items:start}
.private svg{flex:none;margin-top:2px;color:var(--kraft)}
.review{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;background:var(--surface)}
.review .note{font-size:.92rem}
.response{border-left:3px solid var(--blanket);padding:6px 10px;background:var(--blanket-soft);border-radius:0 6px 6px 0;font-size:.88rem}

/* Forms */
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:16px;max-width:720px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.field{display:grid;gap:5px}
.field label,.qlabel{font-size:.8rem;font-weight:600}
.hint{font-size:.78rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 14px;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--blanket);color:var(--on-blanket)}
.seg button:focus-visible{outline:2px solid var(--blanket);outline-offset:-2px}
.toggle{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem}
.toggle[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}

table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* Checkout */
.lines{display:grid;gap:6px;font-variant-numeric:tabular-nums}
.line{display:flex;justify-content:space-between;gap:10px}
.line.total{border-top:1px solid var(--line);padding-top:8px;font-weight:700;font-size:1.05rem}

dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,24,.5)}
.modal-in{padding:22px;display:grid;gap:16px}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.x{all:unset;cursor:pointer;font-size:1.4rem;line-height:1;color:var(--muted);padding:2px 6px;border-radius:4px}
.x:focus-visible{outline:2px solid var(--blanket)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100vw - 32px);z-index:10}
.empty{padding:24px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}

@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
  nav .who{display:none}
  nav button{white-space:nowrap}
  main{padding:20px 16px 60px}
  h1{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="demo-bar">Prototype with demo data. Companies, movers and pay records are fictional.</div>
<header class="top">
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="7" width="17" height="15" rx="2" fill="var(--blanket)"/><path d="M20 12h4.5l3 4.5V22H20z" fill="var(--kraft-tape)"/><circle cx="9" cy="23.5" r="2.6" fill="var(--ink)"/><circle cx="23" cy="23.5" r="2.6" fill="var(--ink)"/><path d="M7 12h9M7 16h6" stroke="var(--on-blanket)" stroke-width="1.6" stroke-linecap="round"/></svg>

</header>
<div class="shell">

  <main id="main"></main>
</div>
<dialog id="modal" aria-labelledby="modalTitle"><div id="modalBody"></div></dialog>
<div id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const TODAY = '2026-10-10';
const BOOKING_FEE = 20;
const STANDBY_PAY = 25;
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const STRENGTHS = ['Careful with furniture','Strong on stairs','Safe driver','Fast packer','Good with customers','Takes direction well'];

const companies = {
  c1:{id:'c1',name:'Redwood Valley Movers',city:'Petaluma',permit:'MTR0190412',ins:'Mar 2027',prefix:'RV',portal:{name:'ADP employee portal',url:'https://my.adp.com'}},
  c2:{id:'c2',name:'Bayside Relocation',city:'Santa Rosa',permit:'MTR0188730',ins:'Jan 2027',prefix:'BR',portal:{name:'Gusto',url:'https://app.gusto.com'}}
};
const movers = {
  m1:{id:'m1',name:'Marcus Reyes',city:'Petaluma',roles:['Helper','Driver'],license:'Class C',years:6,rate:32,days:['Fri','Sat','Sun','Mon'],past:41,bio:'Six years with local and long-distance crews. Comfortable leading a 3-person crew and driving a 26 ft box truck.'},
  m2:{id:'m2',name:'Dani Okafor',city:'Santa Rosa',roles:['Helper','Packer'],license:'None',years:3,rate:28,days:['Sat','Sun'],past:22,bio:'Packing and wrapping specialist. Weekends during school terms.'},
  m3:{id:'m3',name:'Luis Navarro',city:'Novato',roles:['Driver'],license:'Class B',years:9,rate:38,days:['Tue','Wed','Thu','Fri','Sat','Sun'],past:76,bio:'Class B driver, clean record. Handles 26 ft trucks and 53 ft trailers for long hauls.'},
  m4:{id:'m4',name:'Tasha Greene',city:'Rohnert Park',roles:['Crew lead','Packer'],license:'Class C',years:7,rate:34,days:['Mon','Tue','Wed','Thu','Fri'],past:58,bio:'Crew lead for office and commercial moves. Good with customers and inventories.'},

};
/* Hiring paperwork status per company + mover. The company sends its own W-4 / DE 4 / I-9; the app only tracks the status. */
const hires = {'c1:m1':'done','c1:m3':'done','c1:m4':'done','c1:m5':'done','c1:m6':'done','c2:m1':'done','c2:m2':'done','c2:m4':'done','c2:m5':'done','c2:m6':'done','c2:m3':'sent'};
const hireOf = (c,m) => hires[c+':'+m]||'none';

function bk(m,st,rate,hours,extra){return Object.assign({m,st,hours,amount:rate*hours,tip:0,pay:st==='completed'?'paid':'upcoming',reviewed:false},extra||{});}
let jobs = [
  {id:'RV-1042',c:'c1',date:'2026-10-17',start:'8:00 AM',hours:6,city:'Petaluma',route:'Petaluma → Santa Rosa',what:'3-bed house, 2nd-floor walk-up',crew:3,role:'Helper',rate:30,truck:'26 ft box truck',status:'open',bookings:[bk('m1','confirmed',30,6)],applicants:['m2'],standby:[{m:'m6',st:'accepted'},{m:'m5',st:'offered'}]},
  {id:'RV-1043',c:'c1',date:'2026-10-24',start:'9:00 AM',hours:4,city:'Novato',route:'Novato (local)',what:'Small office, 12 workstations',crew:1,role:'Driver',rate:36,truck:'26 ft box truck',status:'open',bookings:[],applicants:[],standby:[]},
  {id:'RV-1040',c:'c1',date:'2026-10-09',start:'7:30 AM',hours:5,city:'Rohnert Park',route:'Rohnert Park → Cotati',what:'2-bed apartment',crew:2,role:'Helper',rate:30,truck:'16 ft box truck',status:'open',bookings:[bk('m4','confirmed',30,5),bk('m6','confirmed',30,5)],applicants:[],standby:[]},
  {id:'RV-1039',c:'c1',date:'2026-10-03',start:'8:00 AM',hours:7,city:'Petaluma',route:'Petaluma → Sonoma',what:'4-bed house with baby grand piano',crew:2,role:'Helper',rate:30,truck:'26 ft box truck',status:'completed',bookings:[bk('m1','completed',30,7,{reviewed:true,tip:50}),bk('m5','completed',30,7)],applicants:[],standby:[]},
  {id:'BR-2201',c:'c2',date:'2026-10-18',start:'7:30 AM',hours:8,city:'Santa Rosa',route:'Santa Rosa → Sacramento',what:'3-bed house, long carry',crew:2,role:'Driver',rate:36,truck:'26 ft box truck',status:'open',bookings:[bk('m3','confirmed',36,8)],applicants:[],standby:[]},
  {id:'BR-2198',c:'c2',date:'2026-09-27',start:'8:00 AM',hours:6,city:'Santa Rosa',route:'Santa Rosa (local)',what:'2-bed condo',crew:2,role:'Helper',rate:30,truck:'16 ft box truck',status:'completed',bookings:[bk('m1','completed',30,6,{reviewed:true,tip:40}),bk('m2','completed',30,6,{reviewed:true,tip:40})],applicants:[],standby:[{m:'m6',st:'done',amount:STANDBY_PAY,pay:'paid'}]},
  {id:'BR-2190',c:'c2',date:'2026-09-13',start:'9:00 AM',hours:5,city:'Windsor',route:'Windsor → Healdsburg',what:'1-bed apartment',crew:2,role:'Helper',rate:28,truck:'16 ft box truck',status:'completed',bookings:[bk('m5','completed',28,5,{reviewed:true,amount:0,hours:0,pay:'none'}),bk('m6','completed',28,5)],applicants:[],standby:[]}
];
let reviews = [
  {id:'r1',m:'m1',c:'c1',job:'RV-1039',date:'2026-10-03',showed:true,onTime:true,rebook:true,strengths:['Careful with furniture','Strong on stairs'],note:'Wrapped and carried the baby grand down two flights without a scratch.',response:null,disputed:false},
  {id:'r2',m:'m1',c:'c2',job:'BR-2198',date:'2026-09-27',showed:true,onTime:false,rebook:true,strengths:['Takes direction well'],note:'Arrived about 20 minutes late. Worked hard once on site.',response:'Highway 101 south was closed at Petaluma Blvd. I texted the crew lead at 7:10 AM.',disputed:false},
  {id:'r3',m:'m2',c:'c2',job:'BR-2198',date:'2026-09-27',showed:true,onTime:true,rebook:true,strengths:['Fast packer','Good with customers'],note:'',response:null,disputed:false},

];

/* Tax documents are never stored in LiftCrew (they carry Social Security numbers).
   The app keeps only a pointer: which document, from which company, and where the mover can get it. */
const DOC_TYPES=['W-2','Pay stubs','Proof of employment or earnings letter','Copy of my W-4 and DE 4','Final pay statement'];
let docs = [
  {id:'d1',m:'m1',c:'c2',type:'W-2',year:2025,how:'portal',note:'Under Documents › Tax forms.',date:'2026-01-28'},
  {id:'d2',m:'m1',c:'c1',type:'Pay stubs',year:2026,how:'portal',note:'',date:'2026-10-06'},
  {id:'d3',m:'m5',c:'c2',type:'Pay stubs',year:2026,how:'email',note:'Sent to the email on file.',date:'2026-09-22'}
];
let docReqs = [
  {id:'q1',m:'m1',c:'c1',type:'Proof of employment or earnings letter',year:2026,note:'Need it for an apartment application.',date:'2026-10-08',status:'open'},
  {id:'q2',m:'m5',c:'c1',type:'Pay stubs',year:2026,note:'',date:'2026-10-09',status:'open'},
  {id:'q3',m:'m1',c:'c2',type:'W-2',year:2025,note:'',date:'2026-01-20',status:'done'}
];
/* Blocks Social Security, card and bank-account-like numbers from free-text fields. */
function sensitive(t){const s=String(t||'');return /\b\d{3}[- ]?\d{2}[- ]?\d{4}\b/.test(s)||/\b(?:\d[ -]?){13,19}\b/.test(s)||/\b\d{9,17}\b/.test(s);}
const SENSITIVE_MSG='Remove the ID or account number. LiftCrew doesn\'t store Social Security, card or bank numbers.';
let acct = null; /* demo accounting connection: {name, since, mode, synced:Set} */
const ACCT_APPS=['QuickBooks Online','Xero','NetSuite','Sage Intacct','FreshBooks','Zoho Books'];

const S = {me:'c1', view:null, filter:{role:'All',day:'Any',q:''}};
let seq = 1044;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = d => new Date(d+'T12:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const dayOf = d => DAYS[(new Date(d+'T12:00').getDay()+6)%7];
const initials = n => n.split(' ').map(w=>w[0]).join('');
const first = n => n.split(' ')[0];
const isCompany = () => S.me.startsWith('c');
const active = b => b.st==='pending'||b.st==='confirmed';
const filled = j => j.bookings.filter(b=>b.st!=='declined'&&b.st!=='canceled').length;
const open = j => j.crew - filled(j);
const daysUntil = d => Math.round((new Date(d+'T12:00')-new Date(TODAY+'T12:00'))/864e5);
const lateCancels = mid => jobs.reduce((a,j)=>a+j.bookings.filter(b=>b.m===mid&&b.st==='canceled'&&b.late).length,0);
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,3800);}
function stats(mid){
  const rs=reviews.filter(r=>r.m===mid);
  const done=movers[mid].past + jobs.reduce((a,j)=>a+j.bookings.filter(b=>b.m===mid&&b.st==='completed').length,0);
  if(!rs.length) return {done,n:0};
  const showed=rs.filter(r=>r.showed);
  return {done,n:rs.length,onTime:showed.length?Math.round(100*showed.filter(r=>r.onTime).length/showed.length):0,
    rebook:Math.round(100*rs.filter(r=>r.rebook).length/rs.length),noShows:rs.length-showed.length};
}
function statusPill(b){
  return {pending:'<span class="pill warn">Waiting on mover</span>',confirmed:'<span class="pill ok">Confirmed</span>',
    completed:'<span class="pill plain">Completed</span>',declined:'<span class="pill bad">Declined</span>',canceled:'<span class="pill bad">Canceled by mover</span>'}[b.st];
}
const payPill = p => ({due:'<span class="pill warn">Pay due</span>',paid:'<span class="pill ok">Paid</span>',none:'<span class="pill plain">No pay</span>'}[p]||'');
const hirePill = h => h==='none'?'<span class="pill warn">Hiring paperwork needed</span>':h==='sent'?'<span class="pill info">Paperwork sent</span>':'';
const lockIcon = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
const PAPERWORK = 'W-4, California DE 4 and Form I-9';

/* ---------- shell ---------- */
const NAV = {
  company:[['jobs','Jobs'],['post','Post a job'],['find','Find movers'],['pay','Pay records'],['docs','Document requests']],
  mover:[['open','Open jobs'],['bookings','My bookings'],['avail','Availability'],['record','My record'],['docs','Documents']]
};
function switchAcct(id){S.me=id;S.view=null;render();window.scrollTo(0,0);}
function go(v){S.view=v;render();window.scrollTo(0,0);}
function render(){
  if(S.me==='new'){$('#acct').value='new';renderOnboarding();return;}
  const type=isCompany()?'company':'mover';
  if(!S.view) S.view=NAV[type][0][0];
  $('#acct').value=S.me;
  const who=isCompany()?companies[S.me]:movers[S.me];
  const pend = !isCompany()? jobs.flatMap(j=>j.bookings).filter(b=>b.m===S.me&&b.st==='pending').length
    + jobs.filter(j=>j.status!=='completed').flatMap(j=>j.standby||[]).filter(s=>s.m===S.me&&s.st==='offered').length : 0;
  const wrap = isCompany()? jobs.filter(j=>j.c===S.me&&needsAttention(j)).length : 0;
  const due = isCompany()? payRows(S.me).filter(r=>r.pay==='due').length : 0;
  $('#nav').innerHTML = `<div class="who"><strong>${esc(who.name)}</strong>${isCompany()?'Moving company · '+esc(who.city):'Mover · '+esc(who.city)}</div>`+
    NAV[type].map(([k,l])=>{
      const n = k==='bookings'?pend:k==='jobs'?wrap:k==='pay'?due:(k==='docs'&&isCompany())?docReqs.filter(q=>q.c===S.me&&q.status==='open').length:0;
      return `<button ${S.view===k?'aria-current="page"':''} onclick="go('${k}')">${l}${n?`<span class="count">${n}</span>`:''}</button>`;}).join('');
  $('#main').innerHTML = VIEWS[S.view]();
}
function needsAttention(j){
  return j.alert || (j.date<TODAY && j.status!=='completed') || j.applicants.length>0
    || j.bookings.some(b=>(b.st==='completed'&&!b.reviewed)||(active(b)&&hireOf(j.c,b.m)!=='done'));
}

/* ---------- modal ---------- */
function modal(html){$('#modalBody').innerHTML=`<div class="modal-in">${html}</div>`;const d=$('#modal');if(!d.open)d.showModal();}
function closeModal(){$('#modal').close();}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
const mhead = (t,sub) => `<div class="modal-head"><div><h2 id="modalTitle">${t}</h2>${sub?`<p class="muted small">${sub}</p>`:''}</div><button class="x" aria-label="Close" onclick="closeModal()">×</button></div>`;

/* ---------- job ticket ---------- */
function ticket(j, forMover){
  const comp=companies[j.c];
  const past=j.date<TODAY;
  const state = j.status==='completed'?'<span class="pill plain">Completed</span>'
    : past?'<span class="pill warn">Needs wrap-up</span>'
    : open(j)>0?`<span class="pill info">${open(j)} of ${j.crew} spots open</span>`:'<span class="pill ok">Crew full</span>';
  const facts = `<div class="facts">
    <div class="fact"><div class="k">Date</div><div class="v">${fmtDate(j.date)}</div></div>
    <div class="fact"><div class="k">Start</div><div class="v">${j.start}</div></div>
    <div class="fact"><div class="k">Est. hours</div><div class="v">${j.hours}</div></div>
    <div class="fact"><div class="k">Role</div><div class="v">${esc(j.role)}</div></div>
    <div class="fact"><div class="k">Pay</div><div class="v">${money(j.rate)}/hr</div></div>
    <div class="fact"><div class="k">Truck</div><div class="v">${esc(j.truck)}</div></div></div>`;
  let body='';
  if(forMover){
    const mine=j.bookings.find(b=>b.m===S.me&&b.st!=='declined');
    const applied=j.applicants.includes(S.me);
    body=`<div class="row" style="justify-content:space-between"><span class="muted small">Est. pay: <b class="mono">${money(j.rate*j.hours)}</b> before taxes, paid by ${esc(comp.name)}</span>
      ${mine?statusPill(mine):applied?'<span class="pill info">Requested</span>':`<button class="btn" onclick="applyJob('${j.id}')">Request this job</button>`}</div>`;
  } else {
    const needPaper=j.bookings.some(b=>active(b)&&hireOf(j.c,b.m)!=='done');
    const crew=j.bookings.map((b,i)=>{
      const h=hireOf(j.c,b.m), m=movers[b.m];
      const sub = b.st==='canceled'?`${esc(b.reason)}${b.late?' · late cancellation':''}`
        : b.st==='completed'?(b.pay==='none'?'No hours worked':`${b.hours} hrs · ${money(b.amount)} wages${b.tip?` + ${money(b.tip)} tip`:''}`)
        : `${money(b.amount)} est. wages`;
      const btns = [
        active(b)&&h==='none'?`<button class="btn quiet" onclick="setHire('${j.c}','${b.m}','sent')">Mark paperwork sent</button>`:'',
        active(b)&&h==='sent'?`<button class="btn quiet" onclick="setHire('${j.c}','${b.m}','done')">Mark set up in payroll</button>`:'',
        b.st==='completed'&&b.pay==='due'?`<button class="btn quiet" onclick="markPaid('${j.id}',${i})">Mark paid</button>`:'',
        b.st==='completed'&&b.pay!=='none'&&!b.tip?`<button class="btn quiet" onclick="tipForm('${j.id}',${i})">Add tip</button>`:'',
        b.st==='completed'&&!b.reviewed?`<button class="btn" onclick="reviewForm('${j.id}',${i})">Review ${esc(first(m.name))}</button>`:''
      ].join('');
      return `<div class="crew-row"><div class="who-line"><span class="av">${initials(m.name)}</span><div><b>${esc(m.name)}</b><div class="muted small">${sub}</div></div></div>
        <div class="row">${statusPill(b)}${active(b)?hirePill(h):''}${b.st==='completed'?payPill(b.pay):''}${btns}<button class="btn quiet" onclick="profile('${b.m}')">Profile</button></div></div>`;
    }).join('');
    const apps=j.applicants.map(m=>`<div class="crew-row"><div class="who-line"><span class="av">${initials(movers[m].name)}</span><div><b>${esc(movers[m].name)}</b> <span class="muted small">requested this job</span></div></div>
      <div class="row"><button class="btn quiet" onclick="profile('${m}')">Profile</button>${open(j)>0?`<button class="btn" onclick="bookForm('${j.id}','${m}',true)">Book</button>`:''}</div></div>`).join('');
    const gone=j.alert&&j.bookings.find(b=>b.st==='canceled'&&!b.seen);
    const banner=!gone?'':gone.replacedBy
      ?`<div class="private" style="border-color:var(--ok);background:var(--ok-soft)"><div style="flex:1;display:grid;gap:8px"><div><b>${esc(movers[gone.m].name)} canceled (${esc(gone.reason.toLowerCase())}). ${esc(movers[gone.replacedBy].name)} was on standby and has moved into the spot.</b> Your crew is still full.</div>
        <div class="row"><button class="btn quiet" onclick="dismissAlert('${j.id}')">Got it</button></div></div></div>`
      :`<div class="private" style="border-color:var(--bad);background:var(--bad-soft)"><div style="flex:1;display:grid;gap:8px"><div><b>${esc(movers[gone.m].name)} canceled (${esc(gone.reason.toLowerCase())}).</b> The spot is open again. ${j.applicants.length?`${j.applicants.length} mover${j.applicants.length>1?'s have':' has'} already requested this job.`:''}</div>
      <div class="row"><button class="btn" onclick="findReplacement('${j.id}')">Find a replacement</button><button class="btn quiet" onclick="dismissAlert('${j.id}')">Dismiss</button></div></div></div>`;
    body=`${banner}<div class="crew">${crew||'<p class="muted small">No one booked yet.</p>'}${apps}</div>
      ${needPaper?`<p class="hint">You're the employer for movers you book. Send new hires your ${PAPERWORK} from your own payroll system, then mark them set up here. LiftCrew doesn't collect or store these forms.</p>`:''}
      ${standbyBlock(j,past)}
      <div class="row">${j.status!=='completed'&&!past&&open(j)>0?`<button class="btn ghost" onclick="S.findFor='${j.id}';go('find')">Find movers for this job</button>`:''}
      ${j.status!=='completed'&&j.bookings.some(b=>b.st==='confirmed')?`<button class="btn${past?'':' quiet'}" onclick="completeJob('${j.id}')">Mark job complete</button>`:''}</div>`;
  }
  return `<article class="ticket"><div class="ticket-head"><div><div class="ticket-no">JOB #${j.id}${forMover?' · '+esc(comp.name):''}</div><h3>${esc(j.route)}</h3><p class="muted small">${esc(j.what)}</p></div>${state}</div>${facts}${body}</article>`;
}
function standbyBlock(j,past){
  const sb=(j.standby||[]).map((s,k)=>({s,k})).filter(x=>x.s.st!=='promoted'&&(j.status!=='completed'||x.s.st==='done'));
  const canAdd=j.status!=='completed'&&!past&&sb.filter(x=>x.s.st!=='declined').length<2;
  if(!sb.length&&!canAdd) return '';
  const pill={accepted:'<span class="pill ok">Standing by</span>',offered:'<span class="pill warn">Offer sent</span>',declined:'<span class="pill plain">Declined</span>'};
  const sub={accepted:`Holding the day. You owe ${money(STANDBY_PAY)} standby pay if they aren't called in.`,offered:'Waiting for a reply',declined:'Not available',done:`Held the day open · ${money(STANDBY_PAY)} standby pay`};
  return `<div class="crew"><div class="row" style="justify-content:space-between"><span class="ticket-no">STANDBY · moves in automatically if someone cancels</span>${canAdd?`<button class="btn ghost" style="padding:4px 10px;font-size:.82rem" onclick="standbyForm('${j.id}')">Add standby mover</button>`:''}</div>
    ${sb.map(({s,k})=>`<div class="crew-row"><div class="who-line"><span class="av">${initials(movers[s.m].name)}</span><div><b>${esc(movers[s.m].name)}</b><div class="muted small">${sub[s.st]}</div></div></div>
      <div class="row">${s.st==='done'?payPill(s.pay)+(s.pay==='due'?`<button class="btn quiet" onclick="markStandbyPaid('${j.id}',${k})">Mark paid</button>`:''):pill[s.st]}</div></div>`).join('')}</div>`;
}
function payRows(cid){
  return jobs.filter(j=>j.c===cid).flatMap(j=>[
    ...j.bookings.map((b,i)=>({j,i,m:b.m,hours:b.hours,amount:b.amount,tip:b.tip,pay:b.pay,st:b.st})).filter(r=>r.st==='completed'),
    ...(j.standby||[]).map((s,k)=>({j,k,m:s.m,hours:null,amount:s.amount,tip:0,pay:s.pay,st:s.st,standby:true})).filter(r=>r.st==='done')
  ]).sort((a,b)=>b.j.date.localeCompare(a.j.date));
}

/* ---------- views ---------- */
const VIEWS = {
  jobs(){
    const mine=jobs.filter(j=>j.c===S.me);
    const act=mine.filter(j=>j.status!=='completed').sort((a,b)=>a.date.localeCompare(b.date));
    const done=mine.filter(j=>j.status==='completed').sort((a,b)=>b.date.localeCompare(a.date));
    return `<div class="page-head"><div><h1>Jobs</h1><p class="muted">Book crew, wrap up finished jobs and review the movers who worked them.</p></div><button class="btn" onclick="go('post')">Post a job</button></div>
      <div class="section-label">Upcoming and in progress</div><div class="list">${act.map(j=>ticket(j)).join('')||'<div class="empty">No active jobs. Post one to start booking crew.</div>'}</div>
      <div class="section-label">Completed</div><div class="list">${done.map(j=>ticket(j)).join('')||'<div class="empty">Completed jobs show up here.</div>'}</div>`;
  },
  post(){
    return `<div class="page-head"><div><h1>Post a job</h1><p class="muted">Movers who are free that day see it in Open jobs and can request it. You can also invite movers directly.</p></div></div>
    <form class="form" id="postForm" onsubmit="postJob(event)">
      <div class="fields">
        <div class="field"><label for="pDate">Date</label><input id="pDate" type="date" min="${TODAY}" value="2026-10-31" required></div>
        <div class="field"><label for="pStart">Start time</label><input id="pStart" type="time" value="08:00" required></div>
        <div class="field"><label for="pHours">Estimated hours</label><input id="pHours" type="number" min="1" max="14" value="5" required></div>
      </div>
      <div class="fields">
        <div class="field"><label for="pRoute">Route</label><input id="pRoute" value="Petaluma → Novato" required></div>
        <div class="field"><label for="pWhat">What's moving</label><input id="pWhat" value="2-bed apartment, elevator building" required></div>
      </div>
      <div class="fields">
        <div class="field"><label for="pRole">Role needed</label><select id="pRole"><option>Helper</option><option>Driver</option><option>Packer</option><option>Crew lead</option></select></div>
        <div class="field"><label for="pCrew">How many</label><input id="pCrew" type="number" min="1" max="10" value="2" required></div>
        <div class="field"><label for="pRate">Hourly pay</label><input id="pRate" type="number" min="1" step="0.5" value="30" required><span class="hint">Bay Area helpers typically $25–40/hr (estimate)</span></div>
        <div class="field"><label for="pTruck">Truck</label><select id="pTruck"><option>16 ft box truck</option><option selected>26 ft box truck</option><option>Cargo van</option><option>No truck (labor only)</option></select></div>
      </div>
      <div class="row"><button class="btn" type="submit">Post job</button><span class="hint">Your Cal-T permit ${esc(companies[S.me].permit)} and insurance (exp. ${esc(companies[S.me].ins)}) are on file.</span></div>
    </form>`;
  },
  find(){
    const forJob = S.findFor && jobs.find(j=>j.id===S.findFor);
    const f=S.filter;
    const list=Object.values(movers).filter(m=>(f.role==='All'||m.roles.includes(f.role))&&(f.day==='Any'||m.days.includes(f.day))&&(!f.q||(m.name+' '+m.city).toLowerCase().includes(f.q.toLowerCase())));
    return `<div class="page-head"><div><h1>Find movers</h1><p class="muted">${forJob?`Showing movers free on ${dayOf(forJob.date)} for job #${forJob.id}. <button class="btn quiet" style="padding:2px 8px" onclick="S.findFor=null;S.filter.day='Any';go('find')">Clear</button>`:'Browse movers in Sonoma and Marin counties. Ratings come from verified, completed jobs only.'}</p></div></div>
      <div class="filters">
        <select id="fRole" aria-label="Role" onchange="S.filter.role=this.value;go('find')">${['All','Helper','Driver','Packer','Crew lead'].map(r=>`<option ${f.role===r?'selected':''}>${r}</option>`).join('')}</select>
        <select id="fDay" aria-label="Available on" onchange="S.filter.day=this.value;go('find')">${['Any',...DAYS].map(d=>`<option value="${d}" ${f.day===d?'selected':''}>${d==='Any'?'Any day':'Free on '+d}</option>`).join('')}</select>
        <input id="fQ" aria-label="Search by name or city" placeholder="Name or city" value="${esc(f.q)}" onchange="S.filter.q=this.value;go('find')">
      </div>
      <div class="grid">${list.map(m=>{const s=stats(m.id);return `<div class="card">
        <div class="who-line"><span class="av lg">${initials(m.name)}</span><div><h3>${esc(m.name)}</h3><div class="muted small">${esc(m.city)} · ${m.years?m.years+' yr'+(m.years>1?'s':''):'New'} · ${esc(m.roles.join(', '))}</div></div></div>
        <div class="stats"><div class="stat"><b>${s.done}</b><span>Jobs</span></div><div class="stat"><b>${s.n?s.onTime+'%':'–'}</b><span>On time</span></div><div class="stat"><b>${s.n?s.rebook+'%':'–'}</b><span>Rebook</span></div></div>
        <div class="days">${DAYS.map(d=>`<span class="day ${m.days.includes(d)?'on':''}">${d}</span>`).join('')}</div>
        <div class="row" style="justify-content:space-between"><span>${hireOf(S.me,m.id)==='done'?'<span class="pill info">On your payroll</span>':`<span class="mono">${money(m.rate)}/hr asking</span>`}</span><button class="btn" onclick="profile('${m.id}')">View profile</button></div></div>`}).join('')||'<div class="empty">No movers match these filters.</div>'}</div>`;
  },
  pay(){
    const rows=payRows(S.me);
    const sum=p=>rows.filter(r=>r.pay===p).reduce((a,r)=>a+r.amount+r.tip,0);
    const tips=rows.reduce((a,r)=>a+r.tip,0);
    const monthBookings=jobs.filter(j=>j.c===S.me&&j.date.startsWith('2026-10')).reduce((a,j)=>a+j.bookings.filter(b=>b.st!=='declined').length,0);
    return `<div class="page-head"><div><h1>Pay records</h1><p class="muted">LiftCrew doesn't process wages or tips. Pay your crew through your own payroll, then mark them paid here so you and the mover have the same record.</p></div><button class="btn" onclick="exportModal()">Export</button></div>
      <div class="row" style="margin-bottom:16px"><span class="pill warn">Due ${money(sum('due'))}</span><span class="pill ok">Paid ${money(sum('paid'))}</span><span class="pill info">Tips ${money(tips)}</span></div>
      <div class="table-wrap"><table><thead><tr><th>Job</th><th>Date</th><th>Mover</th><th class="num">Hours</th><th class="num">Wages</th><th class="num">Tip</th><th class="num">Total owed</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="mono">${r.j.id}</td><td>${fmtDate(r.j.date)}</td><td>${esc(movers[r.m].name)}${r.standby?' <span class="pill plain">Standby</span>':''}</td><td class="num">${r.hours===null?'–':r.hours}</td><td class="num">${money(r.amount)}</td><td class="num">${r.tip?money(r.tip):'–'}</td><td class="num">${money(r.amount+r.tip)}</td><td>${payPill(r.pay)}${acct&&acct.synced.has(r.j.id+':'+r.m+(r.standby?':s':''))?' <span class="pill plain">Synced</span>':''}</td>
        <td>${r.pay==='due'?`<button class="btn quiet" style="padding:4px 10px" onclick="${r.standby?`markStandbyPaid('${r.j.id}',${r.k})`:`markPaid('${r.j.id}',${r.i})`}">Mark paid</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9" class="muted">Completed jobs show up here.</td></tr>'}
      </tbody></table></div>
      ${acctCard(rows)}
      <div class="section-label">Your LiftCrew bill</div>
      <div class="card" style="max-width:460px"><div class="lines"><div class="line"><span>Bookings in October</span><span class="mono">${monthBookings}</span></div><div class="line"><span>Booking fee</span><span class="mono">${money(BOOKING_FEE)} each</span></div><div class="line total"><span>Invoiced Nov 1</span><span class="mono">${money(monthBookings*BOOKING_FEE)}</span></div></div><p class="hint">This is the only thing LiftCrew charges for. Demo figures.</p></div>`;
  },
  docs(){ return isCompany()?companyDocs():moverDocs(); },

  /* ---------- mover views ---------- */
  open(){
    const me=movers[S.me];
    const list=jobs.filter(j=>j.status!=='completed'&&j.date>=TODAY&&open(j)>0).sort((a,b)=>a.date.localeCompare(b.date));
    return `<div class="page-head"><div><h1>Open jobs</h1><p class="muted">Jobs from moving companies that still need crew. Days you're available are marked.</p></div></div>
      <div class="list">${list.map(j=>`${me.days.includes(dayOf(j.date))?'':'<p class="hint">Outside your set availability</p>'}${ticket(j,true)}`).join('')||'<div class="empty">No open jobs right now. Keep your availability current and companies can invite you.</div>'}</div>`;
  },
  bookings(){
    const mine=jobs.flatMap(j=>j.bookings.map((b,i)=>({j,b,i}))).filter(x=>x.b.m===S.me).sort((a,b)=>b.j.date.localeCompare(a.j.date));
    const sbList=jobs.filter(j=>j.status!=='completed'&&j.date>=TODAY).flatMap(j=>(j.standby||[]).map((s,k)=>({j,s,k}))).filter(x=>x.s.m===S.me&&(x.s.st==='offered'||x.s.st==='accepted'));
    const pend=mine.filter(x=>x.b.st==='pending'), up=mine.filter(x=>x.b.st==='confirmed'), done=mine.filter(x=>x.b.st==='completed'||x.b.st==='canceled');
    const sbDone=jobs.flatMap(j=>(j.standby||[]).filter(s=>s.m===S.me&&s.st==='done').map(s=>({j,s})));

const EXPORTS=[
  {k:'xlsx',label:'Excel workbook',ext:'xlsx',desc:'Every pay record in one sheet, for your bookkeeper or for reconciling.'},
  {k:'csv',label:'CSV spreadsheet',ext:'csv',desc:'Opens in Excel, Google Sheets, Numbers and most bookkeeping tools.'},
  {k:'payroll',label:'Payroll hours (Gusto and similar)',ext:'csv',desc:'One row per mover per job with hours, rate, tips and standby pay, to upload when you run payroll.'},
  {k:'qbo',label:'QuickBooks Online journal entry',ext:'csv',desc:'Labor cost by job. Imports directly in Canada and the UK; US QuickBooks Online needs an import app for now.'},
  {k:'iif',label:'QuickBooks Desktop (IIF)',ext:'txt',desc:'General journal entries for File › Utilities › Import › IIF Files. Rename the saved file to .iif.'},
  {k:'xero',label:'Xero manual journal',ext:'csv',desc:"Columns match Xero's manual journal import template. Uses account codes."}
];
S.ex={fmt:'qbo',range:'all',status:'all',exp:'Payroll Expenses:Wages',tips:'Payroll Expenses:Tips',liab:'Payroll Liabilities:Accrued Wages',expCode:'477',liabCode:'814'};
const q = v => { const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
const toCSV = rows => rows.map(r=>r.map(q).join(',')).join('\r\n');
const mdy = d => { const [y,m,dd]=d.split('-'); return `${m}/${dd}/${y}`; };
const n2 = v => (Math.round(v*100)/100).toFixed(2);
function exportRows(){
  const e=S.ex;
  return payRows(S.me).filter(r=>(e.range==='all'||r.j.date.startsWith(e.range))&&(e.status==='all'||r.pay===e.status)&&r.pay!=='none')
    .map(r=>({date:r.j.date,job:r.j.id,route:r.j.route,mover:movers[r.m].name,type:r.standby?'Standby':'Wages',hours:r.hours??0,rate:r.standby?0:r.j.rate,wages:r.standby?0:r.amount,standby:r.standby?r.amount:0,tip:r.tip,total:r.amount+r.tip,status:r.pay==='paid'?'Paid':'Due'}));
}
function byJob(rows){const g={};rows.forEach(r=>(g[r.job]=g[r.job]||[]).push(r));return Object.values(g);}
function buildExport(fmt){
  const e=S.ex, rows=exportRows(), co=companies[S.me].name;
  if(fmt==='csv'||fmt==='xlsx'){
    const head=['Date','Job','Route','Mover','Type','Hours','Hourly rate','Wages','Standby pay','Tip','Total','Status'];
    const body=rows.map(r=>[r.date,r.job,r.route,r.mover,r.type,r.hours,n2(r.rate),n2(r.wages),n2(r.standby),n2(r.tip),n2(r.total),r.status]);
    return {head,body,text:toCSV([head,...body])};
  }
  if(fmt==='payroll'){
    const head=['First name','Last name','Work date','Job','Regular hours','Hourly rate','Gross wages','Paycheck tips','Standby pay'];
    const body=rows.map(r=>{const [f,...l]=r.mover.split(' ');return [f,l.join(' '),r.date,r.job,r.hours,n2(r.rate),n2(r.wages),n2(r.tip),n2(r.standby)];});
    return {text:toCSV([head,...body])};
  }
  if(fmt==='qbo'){
    const out=[['Journal No.','Journal Date','Account Name','Debits','Credits','Description','Name']];
    byJob(rows).forEach(g=>{let tot=0;
      g.forEach(r=>{const lab=r.wages+r.standby; if(lab){out.push([r.job,mdy(r.date),e.exp,n2(lab),'',`${r.type} · ${r.route}${r.hours?' · '+r.hours+' hrs':''}`,r.mover]);tot+=lab;}
        if(r.tip){out.push([r.job,mdy(r.date),e.tips,n2(r.tip),'',`Tip · ${r.route}`,r.mover]);tot+=r.tip;}});
      out.push([g[0].job,mdy(g[0].date),e.liab,'',n2(tot),`Crew labor owed · ${g[0].route}`,'']);});
    return {text:toCSV(out)};
  }
  if(fmt==='iif'){
    const L=['!TRNS\tTRNSTYPE\tDATE\tACCNT\tNAME\tAMOUNT\tDOCNUM\tMEMO','!SPL\tTRNSTYPE\tDATE\tACCNT\tNAME\tAMOUNT\tDOCNUM\tMEMO','!ENDTRNS'];
    const clean=s=>String(s).replace(/[\t\r\n]/g,' ').replace(/→/g,'to').replace(/·/g,'-');
    byJob(rows).forEach(g=>{const tot=g.reduce((a,r)=>a+r.wages+r.standby+r.tip,0);
      L.push(['TRNS','GENERAL JOURNAL',mdy(g[0].date),e.liab,'',n2(-tot),g[0].job,clean('Crew labor owed · '+g[0].route)].join('\t'));
      g.forEach(r=>{const lab=r.wages+r.standby;
        if(lab) L.push(['SPL','GENERAL JOURNAL',mdy(r.date),e.exp,'',n2(lab),r.job,clean(r.mover+' · '+r.type+(r.hours?' · '+r.hours+' hrs':''))].join('\t'));
        if(r.tip) L.push(['SPL','GENERAL JOURNAL',mdy(r.date),e.tips,'',n2(r.tip),r.job,clean(r.mover+' · Tip')].join('\t'));});
      L.push('ENDTRNS');});
    return {text:L.join('\r\n')};
  }
  if(fmt==='xero'){
    const out=[['*Narration','*Date','Description','*AccountCode','*TaxRate','*Amount']];
    byJob(rows).forEach(g=>{let tot=0; const nar=`${co} crew labor ${g[0].job}`;
      g.forEach(r=>{const amt=r.wages+r.standby+r.tip; out.push([nar,mdy(r.date),`${r.mover} · ${r.type}${r.tip?' + tip':''}`,e.expCode,'Tax Exempt',n2(amt)]); tot+=amt;});
      out.push([nar,mdy(g[0].date),'Crew labor owed',e.liabCode,'Tax Exempt',n2(-tot)]);});
    return {text:toCSV(out)};
  }
}
function exportModal(){
  const e=S.ex, f=EXPORTS.find(x=>x.k===e.fmt), out=buildExport(e.fmt), n=exportRows().length;
  const journal=['qbo','iif','xero'].includes(e.fmt);
  const preview=out.text.split(/\r?\n/).slice(0,9).join('\n');
  modal(`${mhead('Export pay records',esc(companies[S.me].name))}
    <div class="crew" role="radiogroup" aria-label="Format">${EXPORTS.map(x=>`<button type="button" role="radio" aria-checked="${x.k===e.fmt}" class="crew-row" style="width:100%;cursor:pointer;text-align:left;border:1px solid ${x.k===e.fmt?'var(--blanket)':'transparent'};font:inherit;color:inherit" onclick="exSet('fmt','${x.k}')"><div style="min-width:0"><b>${x.label}</b><div class="muted small">${esc(x.desc)}</div></div><span class="pill ${x.k===e.fmt?'info':'plain'}">.${x.k==='iif'?'iif':x.ext}</span></button>`).join('')}</div>
    <div class="fields">
      <div class="field"><label for="exRange">Dates</label><select id="exRange" onchange="exSet('range',this.value)">${[['all','All records'],['2026-10','October 2026'],['2026-09','September 2026']].map(([v,l])=>`<option value="${v}" ${e.range===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label for="exStatus">Include</label><select id="exStatus" onchange="exSet('status',this.value)">${[['all','Paid and due'],['paid','Paid only'],['due','Due only']].map(([v,l])=>`<option value="${v}" ${e.status===v?'selected':''}>${l}</option>`).join('')}</select></div>
    </div>
    ${journal?(e.fmt==='xero'?`<div class="fields"><div class="field"><label for="exExpCode">Wages expense account code</label><input id="exExpCode" value="${esc(e.expCode)}" onchange="exSet('expCode',this.value)"></div><div class="field"><label for="exLiabCode">Wages payable account code</label><input id="exLiabCode" value="${esc(e.liabCode)}" onchange="exSet('liabCode',this.value)"></div></div>`
      :`<div class="fields"><div class="field"><label for="exExp">Wages expense account</label><input id="exExp" value="${esc(e.exp)}" onchange="exSet('exp',this.value)"></div><div class="field"><label for="exTips">Tips account</label><input id="exTips" value="${esc(e.tips)}" onchange="exSet('tips',this.value)"></div><div class="field"><label for="exLiab">Wages owed (liability) account</label><input id="exLiab" value="${esc(e.liab)}" onchange="exSet('liab',this.value)"></div></div>`)
      +`<p class="hint">Use your own account names exactly as they appear in your chart of accounts. If your payroll provider already syncs payroll to your books, ask your bookkeeper before importing these, or the wages will be counted twice.</p>`:''}
    <div><div class="qlabel">Preview · ${n} record${n===1?'':'s'}</div><pre class="mono" style="margin:6px 0 0;font-size:.74rem;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;max-height:180px">${esc(preview||'No records match these filters.')}</pre></div>
    <div class="row" style="justify-content:flex-end"><button class="btn quiet" onclick="copyExport()">Copy</button><button class="btn" id="exSave" ${n?'':'disabled'} onclick="saveExport()">Download ${f.k==='iif'?'.iif':'.'+f.ext}</button></div>`);
}
function exSet(k,v){S.ex[k]=v;exportModal();}
function exportName(){const f=EXPORTS.find(x=>x.k===S.ex.fmt);const base=`${companies[S.me].prefix.toLowerCase()}-pay-${S.ex.range==='all'?'all':S.ex.range}-${f.k}`;return base+'.'+f.ext;}
async function copyExport(){
  const t=buildExport(S.ex.fmt).text;
  try{await navigator.clipboard.writeText(t);toast('Copied. Paste it into a spreadsheet or a text file.');}catch(e){toast("Couldn't copy here. Select the preview text and copy it instead.");}

async function saveExport(){
  const dl=await (window.claude?.use?.('downloads')??Promise.resolve(null)).catch(()=>null);
  if(!dl){toast('Downloads aren\'t available in this view. Use Copy instead.');return;}
  let data;
  if(S.ex.fmt==='xlsx'){
    if(!window.XLSX){toast('The Excel library didn\'t load. Try CSV instead.');return;}
    const {head,body}=buildExport('xlsx'); const ws=XLSX.utils.aoa_to_sheet([head,...body.map(r=>r.map((v,i)=>i>=5&&i<=10?+v:v))]);
    ws['!cols']=[{wch:11},{wch:9},{wch:26},{wch:16},{wch:8},{wch:6},{wch:10},{wch:10},{wch:11},{wch:8},{wch:10},{wch:7}];
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Pay records'); data=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  } else data=buildExport(S.ex.fmt).text;
  try{await dl.save({filename:exportName(),data});closeModal();toast(S.ex.fmt==='iif'?'Saved. Rename the file to end in .iif before importing it into QuickBooks Desktop.':'Export saved.');}
  catch(err){ if(err&&err.code==='declined') return; toast(err&&err.code==='rate_limited'?'A save prompt is already open.':'That download didn\'t go through. Use Copy instead.'); }
}

  const sbN=(j.standby||[]).filter(s=>s.st==='accepted').length;

function finishJob(jid){
  const j=jobs.find(x=>x.id===jid), paidNow=$('#alreadyPaid').checked; let owed=0;
  j.bookings.forEach((b,i)=>{
    if(b.st==='confirmed'){
      const hrs=Math.max(0,+$('#hrs-'+i).value||0), tip=Math.max(0,Math.round((+$('#tip-'+i).value||0)*100)/100);
      Object.assign(b,{st:'completed',hours:hrs,amount:Math.round(hrs*j.rate*100)/100,tip,pay:hrs?(paidNow?'paid':'due'):'none'});
      owed+=b.amount+b.tip;
    } else if(b.st==='pending'){b.st='declined';}
  });
  (j.standby||[]).forEach(s=>{if(s.st==='accepted'){Object.assign(s,{st:'done',amount:STANDBY_PAY,pay:paidNow?'paid':'due'});owed+=STANDBY_PAY;}});
  j.status='completed'; closeModal(); render();
  toast(paidNow?`Job #${jid} complete and marked paid. Leave a quick review for each mover.`:`Job #${jid} complete. ${money(owed)} is due to the crew through your payroll; mark it paid on Pay records.`);
}

  S.rv={jid,i,showed:null,onTime:null,rebook:null,strengths:[]};
  const seg=(k,label)=>`<div><div class="qlabel" id="q-${k}">${label}</div><div class="seg" role="group" aria-labelledby="q-${k}" style="margin-top:6px"><button type="button" id="${k}-y" aria-pressed="false" onclick="setRv('${k}',true)">Yes</button><button type="button" id="${k}-n" aria-pressed="false" onclick="setRv('${k}',false)">No</button></div></div>`;
  modal(`${mhead('Review '+esc(m.name),`Job #${j.id} · ${fmtDate(j.date)}`)}
    <div class="private">${lockIcon}<div>Visible to moving companies and to ${esc(first(m.name))}, who can respond or dispute it. Stick to what happened on this job.</div></div>
    <div class="fields">${seg('showed','Did they show up?')}${seg('onTime','Arrive on time?')}${seg('rebook','Would you book them again?')}</div>
    <div><div class="qlabel">Strengths on this job (optional)</div><div class="row" style="margin-top:6px">${STRENGTHS.map((s,k)=>`<button type="button" class="toggle" id="st-${k}" aria-pressed="false" onclick="togStrength(${k})">${s}</button>`).join('')}</div></div>
    <div class="field"><label for="rvNote">Note (optional, 280 characters)</label><textarea id="rvNote" rows="2" maxlength="280" placeholder="Example: Wrapped the dining set carefully and finished the truck load early."></textarea></div>
    <div class="row" style="justify-content:flex-end"><button class="btn quiet" onclick="closeModal()">Later</button><button class="btn" id="rvSave" disabled onclick="saveReview()">Save review</button></div>`);
}
function setRv(k,v){
  S.rv[k]=v; $('#'+k+'-y').setAttribute('aria-pressed',v); $('#'+k+'-n').setAttribute('aria-pressed',!v);
  if(k==='showed'&&!v){S.rv.onTime=false;$('#onTime-y').setAttribute('aria-pressed',false);$('#onTime-n').setAttribute('aria-pressed',true);}
  $('#rvSave').disabled = S.rv.showed===null||S.rv.onTime===null||S.rv.rebook===null;
}
function togStrength(k){const s=STRENGTHS[k],a=S.rv.strengths,on=!a.includes(s);S.rv.strengths=on?[...a,s]:a.filter(x=>x!==s);$('#st-'+k).setAttribute('aria-pressed',on);}
function saveReview(){
  const {jid,i}=S.rv, j=jobs.find(x=>x.id===jid), b=j.bookings[i];
  if(sensitive($('#rvNote').value)){toast(SENSITIVE_MSG);return;}
  reviews.push({id:'r'+Date.now(),m:b.m,c:j.c,job:j.id,date:j.date,showed:S.rv.showed,onTime:S.rv.onTime,rebook:S.rv.rebook,strengths:S.rv.strengths,note:$('#rvNote').value.trim(),response:null,disputed:false});
  b.reviewed=true; closeModal(); render();
  toast(`Review saved. Visible to moving companies and to ${first(movers[b.m].name)}.`);
}
function postJob(e){
  e.preventDefault();
  const t=$('#pStart').value.split(':'); let h=+t[0]; const ap=h>=12?'PM':'AM'; h=h%12||12;
  const route=$('#pRoute').value.trim();
  const j={id:companies[S.me].prefix+'-'+(seq++),c:S.me,date:$('#pDate').value,start:`${h}:${t[1]} ${ap}`,hours:+$('#pHours').value,city:route.split('→')[0].trim(),route,what:$('#pWhat').value.trim(),crew:+$('#pCrew').value,role:$('#pRole').value,rate:+$('#pRate').value,truck:$('#pTruck').value,status:'open',bookings:[],applicants:[],standby:[]};
  jobs.push(j); S.findFor=j.id; S.filter={role:j.role,day:dayOf(j.date),q:''};
  go('find'); toast(`Job #${j.id} posted. Here are ${j.role.toLowerCase()}s free on ${dayOf(j.date)}.`);
}
function cancelForm(jid,i){
  const j=jobs.find(x=>x.id===jid), late=daysUntil(j.date)<2;
  modal(`${mhead("Can't make this job?",`#${j.id} · ${fmtDate(j.date)} · ${j.start} · ${esc(companies[j.c].name)}`)}
    <div class="field"><label for="cReason">Reason</label><select id="cReason"><option>Sick</option><option>Family emergency</option><option>Car or truck trouble</option><option>Schedule conflict</option><option>Other</option></select><span class="hint">${esc(companies[j.c].name)} sees this reason.</span></div>
    <div class="private" style="${late?'border-color:var(--warn);background:var(--warn-soft)':''}">${lockIcon}<div>${late?`<b>This job is less than 48 hours away.</b> It will show as a late cancellation on your record, which moving companies can see.`:`This job is more than 48 hours away, so canceling won't show on your record.`} The company is told right away.</div></div>
    <div class="row" style="justify-content:flex-end"><button class="btn quiet" onclick="closeModal()">Keep the job</button><button class="btn danger" onclick="confirmCancel('${jid}',${i})">Cancel my spot</button></div>`);
}
function confirmCancel(jid,i){
  const j=jobs.find(x=>x.id===jid), b=j.bookings[i];
  Object.assign(b,{st:'canceled',pay:'none',reason:$('#cReason').value,late:daysUntil(j.date)<2,seen:false});
  const s=(j.standby||[]).find(x=>x.st==='accepted');
  if(s){s.st='promoted';j.bookings.push(bk(s.m,'confirmed',j.rate,j.hours));b.replacedBy=s.m;}
  j.alert=true; closeModal(); render();
  toast(`Canceled. ${companies[j.c].name} has been notified${s?' and a standby mover took your spot':''}.`);
}
function standbyForm(jid){
  const j=jobs.find(x=>x.id===jid), d=dayOf(j.date);
  const list=Object.values(movers).filter(m=>!j.bookings.some(b=>b.m===m.id&&active(b))&&!(j.standby||[]).some(s=>s.m===m.id&&s.st!=='declined'))
    .sort((a,b)=>(b.days.includes(d))-(a.days.includes(d)));
  modal(`${mhead('Add a standby mover',`#${j.id} · ${fmtDate(j.date)} · ${esc(j.route)}`)}
    <p>A standby mover agrees to keep the day open. If anyone on this crew cancels, they move into the spot automatically at the same rate. If no one cancels, you owe them ${money(STANDBY_PAY)} standby pay through your payroll. You can have up to two.</p>
    <div class="crew">${list.map(m=>`<div class="crew-row"><div class="who-line"><span class="av">${initials(m.name)}</span><div><b>${esc(m.name)}</b><div class="muted small">${esc(m.roles.join(', '))} · ${esc(m.city)}</div></div></div>
      <div class="row">${m.days.includes(d)?`<span class="pill ok">Free ${d}</span>`:`<span class="pill plain">Not usually free ${d}</span>`}<button class="btn" onclick="offerStandby('${jid}','${m.id}')">Offer standby</button></div></div>`).join('')||'<div class="empty">Everyone available is already on this job.</div>'}</div>`);
}
function offerStandby(jid,mid){
  const j=jobs.find(x=>x.id===jid); j.standby=(j.standby||[]).filter(s=>s.m!==mid); j.standby.push({m:mid,st:'offered'});
  closeModal(); render(); toast(`Standby offer sent to ${first(movers[mid].name)}.`);
}
function standbyRespond(jid,k,yes){
  const j=jobs.find(x=>x.id===jid), s=j.standby[k]; s.st=yes?'accepted':'declined'; render();
  toast(yes?`You're on standby for #${jid}. Keep ${fmtDate(j.date)} open.`:`Done. ${companies[j.c].name} has been told you're not available.`);
}
function dismissAlert(jid){const j=jobs.find(x=>x.id===jid);j.bookings.forEach(b=>{if(b.st==='canceled')b.seen=true;});j.alert=false;render();}
function findReplacement(jid){
  const j=jobs.find(x=>x.id===jid); dismissAlert(jid);
  S.findFor=jid; S.filter={role:j.role,day:dayOf(j.date),q:''}; go('find');
  toast(`Showing ${j.role.toLowerCase()}s free on ${dayOf(j.date)}. Booking one fills the open spot.`);
}
function applyJob(jid){const j=jobs.find(x=>x.id===jid);j.applicants.push(S.me);render();toast(`Request sent to ${companies[j.c].name}.`);}
function respond(jid,i,yes){
  const j=jobs.find(x=>x.id===jid), b=j.bookings[i];
  if(yes){b.st='confirmed';toast(`You're confirmed for #${jid} on ${fmtDate(j.date)}.`);} else {b.st='declined';toast(`Declined. ${companies[j.c].name} has been told.`);}
  render();
}
function toggleDay(d){const m=movers[S.me];m.days=m.days.includes(d)?m.days.filter(x=>x!==d):DAYS.filter(x=>x===d||m.days.includes(x));render();}
function saveAvail(){if(sensitive($('#aBio').value)){toast(SENSITIVE_MSG);return;}const m=movers[S.me];m.rate=+$('#aRate').value||m.rate;m.city=$('#aCity').value.trim()||m.city;m.license=$('#aLic').value;m.bio=$('#aBio').value.trim();render();toast('Availability saved. Companies see the update right away.');}
function openResponse(rid){
  $('#resp-'+rid).innerHTML=`<div class="field"><label for="ra-${rid}">Your response (shown under the review)</label><textarea id="ra-${rid}" rows="2" maxlength="280"></textarea><div class="row"><button class="btn" onclick="saveResponse('${rid}')">Post response</button><button class="btn quiet" onclick="render()">Cancel</button></div></div>`;
  $('#ra-'+rid).focus();
}
function saveResponse(rid){const v=$('#ra-'+rid).value.trim();if(!v){toast('Write a response first, or cancel.');return;}if(sensitive(v)){toast(SENSITIVE_MSG);return;}reviews.find(r=>r.id===rid).response=v;render();toast('Response posted. Companies see it with the review.');}
function dispute(rid){reviews.find(r=>r.id===rid).disputed=true;render();toast('Dispute sent to LiftCrew support. We review disputes within 5 business days.');}

render();
</script>
